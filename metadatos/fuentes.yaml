# Copias digitalizadas por Memoria Chilena (Biblioteca Nacional de Chile), descargadas el 2026-10-21
# desde la página «Los censos de población en Chile (1813-2002)» (w3-article-31530). Están en la misma
# carpeta que las publicaciones del INE. Sirven como fuente complementaria: escaneo en grises o color de
# ~150 dpi, casi todas con capa de texto OCR (poco confiable para cifras). «complementa» indica la
# publicación del INE de la misma obra (null si no hay). Las fichas indican la condición de propiedad
# intelectual de cada obra. No están en Memoria Chilena los censos de 1835, 1854 ni 1940.
