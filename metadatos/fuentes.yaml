microdatos:
  - id: micro_1982
    censo: 1982
    acceso: transparencia
    solicitud: null  # pendiente: número y fecha de la solicitud
    formato_original: [csv, sav]
    tablas: [viviendas, hogares, personas]
    documentacion: [Cuestionario Censal.xls]
  - id: micro_1992
    censo: 1992
    acceso: transparencia
    solicitud: null  # pendiente
    formato_original: csv
    tablas: [portafolios, viviendas, hogares, uso_piezas, personas]
    tablas_auxiliares: [REGIONES, PROVINCIAS, COMUNAS, DISTRITOS, LOCALIDAD, ENTIDAD, CATEGORIA, PAISES, OCUPACION, RAMA_ACTIVIDAD]
    documentacion: [ind_code_cl1992.pdf]
    notas: CSV en codificación latin-1, exportado desde R (primera columna = número de fila).
  - id: micro_2002
    censo: 2002
    acceso: transparencia
    solicitud: null  # pendiente
    formato_original: csv
    tablas: [portafolios, viviendas, personas]
    tablas_auxiliares: [REGIONES, PROVINCIAS, COMUNAS, DISTRITOS, LOCALIDADES, ENTIDADES, CATEGORIAS, Coordenadas_Censo2002]
    notas: Sin tabla de hogares separada. Variables con códigos de pregunta (P17, P18, ...).
  - id: micro_2017
    censo: 2017
    acceso: web
    formato_original: csv (comprimido en .rar)
    archivos:
      viviendas: https://www.ine.gob.cl/docs/default-source/censo-de-poblacion-y-vivienda/bbdd/censo-2017/csv/csv-viviendas-censo-2017.rar?sfvrsn=d741a14a_2&download=true
      hogares: https://www.ine.gob.cl/docs/default-source/censo-de-poblacion-y-vivienda/bbdd/censo-2017/csv/csv-hogares-censo-2017.rar?sfvrsn=4f1ab5d3_2&download=true
      personas: https://www.ine.gob.cl/docs/default-source/censo-de-poblacion-y-vivienda/bbdd/censo-2017/csv/csv-personas-censo-2017.rar?sfvrsn=60c6e91c_2&download=true
      identificacion_geografica: https://www.ine.gob.cl/docs/default-source/censo-de-poblacion-y-vivienda/bbdd/censo-2017/csv/csv-identificaci%C3%B3n-geogr%C3%A1fica-censo-2017.rar?sfvrsn=1ae6f56c_2&download=true
      manzana_entidad: https://www.ine.gob.cl/docs/default-source/censo-de-poblacion-y-vivienda/bbdd/censo-2017/csv/csv-manzana---entidad-censo-2017.rar?sfvrsn=1ce846c8_2&download=true
    tablas: [viviendas, hogares, personas]
    documentacion: [Léame - CSV Microdatos Viviendas Censo 2017.pdf, Léame - CSV Microdatos Manzana- entidad Censo 2017.pdf]
  - id: micro_2024
    censo: 2024
