nombre: parentesco
etiqueta: Relación de parentesco con el jefe(a) de hogar
unidad: persona
tema: demografia
nivel: nucleo
definicion: Relación de cada persona con la persona reconocida como jefa o jefe del hogar.
universo: Todas las personas censadas.

# recodificacion: {código original: [general, detallado]}; detallado nulo = el censo no distingue.
categorias:
  - {codigo: 1, etiqueta: Jefe/a de hogar}
  - codigo: 2
    etiqueta: Cónyuge, conviviente o pareja
    detallado:
      - {codigo: 21, etiqueta: Esposo/a o cónyuge}
      - {codigo: 22, etiqueta: Conviviente de hecho o pareja}
      - {codigo: 23, etiqueta: Conviviente por unión civil}
  - codigo: 3
    etiqueta: Hijo/a o hijastro/a
    detallado:
      - {codigo: 31, etiqueta: Hijo/a}
      - {codigo: 32, etiqueta: "Hijastro/a o hijo/a del cónyuge, conviviente o pareja"}
  - {codigo: 4, etiqueta: Yerno o nuera}
  - {codigo: 5, etiqueta: Nieto/a}
  - codigo: 6
    etiqueta: Hermano/a o cuñado/a
    detallado:
      - {codigo: 61, etiqueta: Hermano/a}
      - {codigo: 62, etiqueta: Cuñado/a}
  - codigo: 7
    etiqueta: Padre/madre o suegro/a
    detallado:
      - {codigo: 71, etiqueta: Padre/madre}
      - {codigo: 72, etiqueta: Suegro/a}
  - codigo: 8
    etiqueta: Otro pariente
    detallado:
      - {codigo: 81, etiqueta: Abuelo/a}
      - {codigo: 82, etiqueta: Otro pariente (sin abuelo/a)}
  - {codigo: 9, etiqueta: No pariente}
  - {codigo: 10, etiqueta: Servicio doméstico puertas adentro}
  - {codigo: 11, etiqueta: Persona en vivienda colectiva}
  - codigo: 12
    etiqueta: Persona censada fuera de una vivienda (en tránsito o en situación de calle)
    detallado:
      - {codigo: 121, etiqueta: Persona en tránsito}
      - {codigo: 122, etiqueta: Persona en situación de calle}

nota_armonizacion: >
  La categoría general es comparable en los cuatro censos. Es tan agregada como el censo que
  menos distingue: 1992 junta hermanos con cuñados, padres con suegros e hijos con hijastros, y
  no separa a los abuelos de otros parientes. Las categorías 11 y 12 no son relaciones de
  parentesco: identifican a quienes no forman parte de un hogar particular.

