nombre: edad
etiqueta: Edad en años cumplidos
unidad: persona
tema: demografia
nivel: nucleo
definicion: Edad en años cumplidos a la fecha del censo, tal como la registra cada censo.
universo: Todas las personas censadas.
categorias:
  - {codigo: "0-108", etiqueta: Años cumplidos (el máximo y el tramo abierto final dependen del censo)}
  - {codigo: -3, etiqueta: Suprimida por anonimización}
nota_armonizacion: >
  Se conserva la edad original sin tope: cada censo tiene su propio máximo, que puede ser un tramo
  abierto (1992: 99 o más; 2017: 100 o más; 2024: 85 o más). Para comparar entre censos se usa
  edad_85 (tope común de 85 años). La edad suprimida de 2024 se codifica -3.

# rango: valores que pasan tal cual; faltantes: código original -> código de faltante común
# (-1 no aplica, -2 ignorado, -3 suprimido). Cualquier otro valor detiene el pipeline.
censos:
  1992:
    tabla: personas
    variables_originales: [Edad]
    rango: [0, 99]
    regla: Edad tal cual; 99 = "99 años o más" según el cuestionario.
    estado: borrador
  2002:
    tabla: personas
    variables_originales: [P19]
    rango: [0, 108]
    regla: Edad tal cual, sin tope.
    estado: borrador
  2017:
    tabla: personas
    variables_originales: [P09]
    rango: [0, 100]
    regla: Edad tal cual; 100 = "100 o más" (por verificar).
    estado: borrador
  2024:
    tabla: personas
    variables_originales: [edad]
    pregunta: "21. ¿Cuántos años cumplidos tiene?"
    rango: [0, 85]
    faltantes: {-66: -3}
    regla: Edad tal cual (85 = 85 o más); -66 = valor suprimido por anonimización -> -3.
    comparabilidad: 151.199 personas (0,8 %) con edad suprimida en la base pública, todas en las 51 comunas bajo umbral.
    estado: verificado
