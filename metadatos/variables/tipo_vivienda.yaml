nombre: tipo_vivienda
etiqueta: Tipo de vivienda
unidad: vivienda
tema: vivienda
nivel: nucleo
definicion: Tipo de vivienda según la observación del censista, incluida la distinción entre vivienda particular y colectiva.
universo: Todos los registros de la tabla de viviendas (incluye los operativos que no son viviendas).

# recodificacion: {código original: [general, detallado]}; detallado nulo = el censo no distingue.
categorias:
  - {codigo: 1, etiqueta: Casa}
  - {codigo: 2, etiqueta: Departamento en edificio}
  - {codigo: 3, etiqueta: Pieza en casa antigua o en conventillo}
  - codigo: 4
    etiqueta: Mediagua, mejora, rancho, choza o vivienda tradicional indígena
    detallado:
      - {codigo: 41, etiqueta: Mediagua o mejora}
      - {codigo: 42, etiqueta: Rancho o choza}
      - {codigo: 43, etiqueta: Ruca o vivienda tradicional indígena}
      - {codigo: 44, etiqueta: "Rancho, choza o ruca (1992)"}
      - {codigo: 45, etiqueta: "Mediagua, mejora, rancho o choza (2017, 2024)"}
  - {codigo: 5, etiqueta: "Móvil (carpa, vagón, casa rodante o similar)"}
  - {codigo: 6, etiqueta: Otro tipo de vivienda particular}
  - codigo: 7
    etiqueta: Vivienda colectiva
    detallado:
      - {codigo: 71, etiqueta: Residencial o pensión}
      - {codigo: 72, etiqueta: "Hotel, motel o posada"}
      - {codigo: 73, etiqueta: "Institución (internado, hospital, regimiento, etc.)"}
      - {codigo: 74, etiqueta: Otra vivienda colectiva}
  - codigo: 8
    etiqueta: No es vivienda (operativo de personas en tránsito o en situación de calle)
    detallado:
      - {codigo: 81, etiqueta: Operativo de personas en tránsito}
      - {codigo: 82, etiqueta: Operativo de personas en situación de calle}

nota_armonizacion: >
  Las categorías precarias se agrupan en la categoría 4 porque cada censo las combina distinto:
  1992 junta rancho, choza y ruca; 2002 separa las tres; 2017 y 2024 juntan mediagua con rancho y
  choza, y separan la vivienda tradicional indígena. Los detallados 44 y 45 conservan esas
  agrupaciones propias. Vivienda particular = categorías 1 a 6.

