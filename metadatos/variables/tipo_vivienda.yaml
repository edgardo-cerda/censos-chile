  2024:
    tabla: viviendas
    variables_originales: [tipo_operativo, p2_tipo_vivienda]
    pregunta: "2. Seleccione el tipo de vivienda particular"
    regla: >
      tipo_operativo 3 -> 7 (vivienda colectiva); tipo_operativo 1 -> [8, 82] (situación de calle);
      tipo_operativo 2 -> según p2_tipo_vivienda.
    recodificacion_variable: p2_tipo_vivienda
    recodificacion:
      1: [1, null]
      3: [2, null]
      5: [4, 43]
      6: [3, null]
      7: [4, 45]
      8: [5, null]
      9: [6, null]
    recodificacion_operativo:
      1: [8, 82]
      3: [7, null]
    comparabilidad: >
      El cuestionario distingue casa con acceso directo y casa en condominio (1, 2) y departamento
      con y sin ascensor (3, 4), pero la base pública solo trae los códigos 1 y 3. El código 7
      incluye la vivienda de emergencia. Sin operativo de personas en tránsito. Cada persona en
      situación de calle es un registro de la tabla de viviendas (21.750), mientras que en 2017 los
      operativos agrupan personas (219 registros): la categoría 8 no es comparable en número de registros.
    estado: borrador
