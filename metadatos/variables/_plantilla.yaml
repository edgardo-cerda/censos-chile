# Plantilla de ficha de variable armonizada. Copiar como <nombre>.yaml.
# Reglas completas en docs/estructura_microdatos.md (sección "Capa 2").

nombre: nombre_variable        # snake_case, único en el proyecto
etiqueta: Etiqueta corta
unidad: persona                # persona | hogar | vivienda
tema: demografia               # demografia | territorio | educacion | trabajo | migracion | vivienda | hogar | ...
nivel: nucleo                  # nucleo | ampliado
definicion: >
  Qué mide la variable armonizada.
universo: Todas las personas censadas.

# Catálogo de la versión común (<variable>): las categorías generales son las de la versión
# comparable (<variable>_comp); "detallado" (opcional) agrega las distinciones que solo hacen
# algunos censos. Códigos generales de un dígito y detallados de dos. Etiquetas Sí/No entre comillas.
categorias:
  - codigo: 1
    etiqueta: Categoría
    # detallado:
    #   - {codigo: 11, etiqueta: Subcategoría}

# Universo común de la versión comparable (opcional): fuera de él, -1. Condiciones sobre variables
# armonizadas: {min: n}, {max: n}, {en: [códigos]}; se puede usar <variable>_comp.
# universo_comparable:
#   edad: {min: 15}

# Variables calculadas desde otra tabla de la capa 1 (opcional): derivada: conteo

# Una entrada por censo que tenga la variable (sin entrada = NULL: el censo no la preguntó).
censos:
  1992:
    tabla: personas
    variables_originales: [Variable]
    pregunta: null             # texto de la pregunta en el cuestionario, si se conoce
    universo: {edad: {min: 15}}  # opcional: universo del censo; fuera de él, -1
    recodificacion: {}         # {código original: código común}
    # rango: [0, 99]           # variables numéricas: valores que pasan tal cual (hasta el máximo observado)
    faltantes: {}              # {código original: -1 | -2 | -3}; `null` = valor vacío
    clase: comparable          # comparable | con_reservas | solo_comun (solo_comun: _comp nulo)
    comparabilidad: null       # diferencias de definición, universo o captura
    # control: {viviendas: [variable_original]}  # variables contadas: deben coincidir con esta
    estado: borrador           # borrador | verificado
