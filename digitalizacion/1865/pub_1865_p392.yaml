# Transcripción del "Cuadro sinóptico de los censos de la República levantados en 1835, 1843, 1854
# i 1865" (censo de 1865, pág. 392). Sin número de cuadro: se identifica por su página impresa.
# El CSV trae la población por departamento tal como está impresa ("..": puntos impresos, el
# departamento no existía); la columna provincia_1865 indica la provincia de 1865 de cada fila. Los
# totales por provincia de cada censo, con las provincias de ese censo, van en pub_1865_p392_prov.

fuente_id: pub_1865
cuadro: "p392"
titulo: Cuadro sinóptico de los censos de la República levantados en 1835, 1843, 1854 i 1865
paginas:
  - {pdf: 425, impresa: "392", desde: Colonia de Magallanes}
metodo: transcripcion_manual
verificacion: control_aritmetico
transcripcion:
  fecha: 2026-10-19
  por: Claude (asistido)
  recortes_dpi: 220-400
  nota: >
    Escaneo de baja calidad con números de estilo antiguo: 4 y 3 se confunden con 1. Las cifras
    dudosas se resolvieron con el cuadro sinóptico de 1875 (pub_1875_p645, mismo contenido y
    escaneo nítido), con las sumas de cada departamento contra el total de su provincia y de la
    República, y con el Cuadro 1 de 1920. Ver notas de celdas.

indicador: poblacion
unidad: personas
fijas: {area: _T, sexo: _T}

territorio:
  columna: territorio
  nivel: {Total: pais, _otro: departamento}
  # Departamentos vigentes en cada censo (".." si no existía).
  dpa_version: "provincias_{censo}"

columnas:
  "1865": {censo: 1865}
  "1854": {censo: 1854}
  "1843": {censo: 1843}
  "1835": {censo: 1835}

notas_cuadro:
  - >
    Validado contra el cuadro sinóptico de 1875: las 192 cifras de departamento coinciden, salvo
    Talca 1865 (84 630 aquí; 84 660 en 1875, errata de 1875). En los cuatro censos la suma de los
    departamentos es igual al total de la República.

