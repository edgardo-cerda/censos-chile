# Transcripción del cuadro "Clasificación de los habitantes por departamentos, según el sexo, edad,
# estado civil i grado de instrucción" del censo de 1865 (Censo general de la República, págs.
# 352-353). Sin número de cuadro: se identifica por su página impresa inicial (352).
# El CSV reproduce la edad por sexo y los totales ("-" = puntos impresos); se omiten el número de
# subdelegaciones y distritos, el estado civil y la instrucción (pendientes para los módulos
# temáticos). La columna provincia agrupa los departamentos como las llaves del original.

fuente_id: pub_1865
cuadro: "p352"
titulo: Clasificación de los habitantes por departamentos, según el sexo, edad, estado civil i grado de instrucción
paginas:
  - {pdf: 385, impresa: "352", desde: Territorio de Magallanes}
  - {pdf: 386, impresa: "353", columnas: [50a80_h, 50a80_m, 80mas_h, 80mas_m, total_h, total_m, total_general]}
metodo: transcripcion_manual
verificacion: control_aritmetico
transcripcion:
  fecha: 2026-10-19
  por: Claude (asistido)
  recortes_dpi: 210-600
  nota: >
    El escaneo es malo y los números de estilo antiguo pierden los trazos bajo la línea: el 4 se lee
    casi siempre como 1 (y a veces 3 como 1, 6 como 0). Cada cifra entra en dos sumas independientes:
    el total del sexo en el departamento (fila) y la suma de la provincia, que debe dar la cifra de
    la clasificación por provincias (pág. 360, validada contra el Cuadro 6 de 1952). Las cifras
    dudosas se fijaron con esas dos sumas; los totales generales coinciden con el cuadro sinóptico.

indicador: poblacion
unidad: personas
fijas: {censo: 1865, area: _T}

territorio:
  columna: territorio
  nivel: {Total: pais, _otro: departamento}
  dpa_version: provincias_1865

columnas:
  hasta7_h: {sexo: hombre, edad_min: 0, edad_max: 7}
  hasta7_m: {sexo: mujer, edad_min: 0, edad_max: 7}
  7a15_h: {sexo: hombre, edad_min: 8, edad_max: 15}
  7a15_m: {sexo: mujer, edad_min: 8, edad_max: 15}
  15a25_h: {sexo: hombre, edad_min: 16, edad_max: 25}
  15a25_m: {sexo: mujer, edad_min: 16, edad_max: 25}
  25a50_h: {sexo: hombre, edad_min: 26, edad_max: 50}
  25a50_m: {sexo: mujer, edad_min: 26, edad_max: 50}
  50a80_h: {sexo: hombre, edad_min: 51, edad_max: 80}
  50a80_m: {sexo: mujer, edad_min: 51, edad_max: 80}
  80mas_h: {sexo: hombre, edad_min: 81}
  80mas_m: {sexo: mujer, edad_min: 81}
  total_h: {sexo: hombre}
  total_m: {sexo: mujer}
  total_general: {sexo: _T}

notas_cuadro:
  - >
    Tramos impresos "hasta 7 años", "de 7 a 15", "de 15 a 25", "de 25 a 50", "de 50 a 80" y "de 80
    adelante"; se registran como 0-7, 8-15, 16-25, 26-50, 51-80 y 81 y más (ver pub_1865_p360).
  - >
    Validación: con las cifras adoptadas, las 52 filas cuadran (edades = total de cada sexo; hombres
    + mujeres = total general, igual al sinóptico de 1865) y la suma de los departamentos de cada
    provincia es igual, celda por celda, a la clasificación por provincias (pág. 360).
    Excepciones: Caupolicán 16-25 hombres y Quinchao hasta 7 hombres (erratas impresas).
  - >
    Coquimbo: en esa provincia varias combinaciones de dígitos satisfacían las sumas; se adoptó la
    que solo usa la confusión 4/1 del escaneo y que respalda la suma de las subdelegaciones del
    bloque provincial (PDF 302). La copia de Memoria Chilena confirma todas esas cifras.
  - >
    Revisión con la copia de Memoria Chilena (mc_1865, PDF 386-387): es otro ejemplar, escaneado en
    gris a unos 150 dpi. Confirma 55 de las 62 cifras adoptadas. En Itata y Linares (7-15 y 15-25
    mujeres) las sumas admitían dos soluciones y se había adoptado la equivocada; se corrigió con la
    copia. Quinchao hasta 7 hombres resultó una errata impresa (1336). Ancud 7-15 mujeres, Talca
    16-25 y 51-80 hombres y Copiapó 16-25 hombres siguen fijadas por las sumas.

