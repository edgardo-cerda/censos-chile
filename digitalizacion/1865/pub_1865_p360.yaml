  - {territorio: Santiago, columna: 25a50_h, nota: "Se lee 52411; se adopta 52441, que cuadra con el total de hombres de la provincia y de la República (igual al Cuadro 6 de 1952). La copia de Memoria Chilena (mc_1865) muestra 52441."}
  - {territorio: Valparaíso, columna: 25a50_h, nota: "Se lee 25182; se adopta 25482, que cuadra con el total de hombres de la provincia y de la República (igual al Cuadro 6 de 1952). La copia de Memoria Chilena (mc_1865) muestra 25482."}
  - {territorio: Valparaíso, columna: 25a50_m, nota: "Se lee 21686; se adopta 24688, que cuadra con el total de mujeres de la provincia y de la República (igual al Cuadro 6 de 1952). La copia de Memoria Chilena (mc_1865) muestra 24688."}
  - {territorio: Coquimbo, columna: 7a15_h, nota: "Se lee 15428 (la última cifra puede ser 3 u 8); se adopta 15423, que cuadra con el total de hombres de la provincia y de la República (igual al Cuadro 6 de 1952). La copia de Memoria Chilena (mc_1865) muestra 15423."}

controles:
  - {tipo: suma_dimension, dimension: edad_min, total: "", partes: [0, 8, 16, 26, 51, 81]}
  - {tipo: suma_dimension, dimension: sexo, total: _T, partes: [hombre, mujer]}
  - {tipo: suma_territorio, total: pais, partes: provincia}
