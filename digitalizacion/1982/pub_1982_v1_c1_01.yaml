verificacion: control_aritmetico
transcripcion:
  fecha: 2026-10-15
  por: Claude (asistido)
  recortes_dpi: 170
  nota: >
    Lectura visual de cada página. Todas las filas cumplen hombres + mujeres = total, la
    jerarquía comuna -> provincia -> región -> país en las tres secciones, y urbano + rural =
    total en cada unidad, sin ninguna diferencia. Un OCR independiente (RapidOCR) coincidió
    exactamente en 430 filas; el resto de sus diferencias son errores del OCR.

indicador: poblacion
unidad: personas

territorio:
  columna: territorio
  columna_nivel: nivel
  niveles: [region, provincia, comuna]
  dpa_version: DPA1982

filas:
