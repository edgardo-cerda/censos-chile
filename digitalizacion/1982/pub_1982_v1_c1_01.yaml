columnas:
  total: {censo: 1982, sexo: _T}
  hombres: {censo: 1982, sexo: hombre}
  mujeres: {censo: 1982, sexo: mujer}

notas_cuadro:
  - >
    División político-administrativa de 1982: 13 regiones, provincias y comunas (anterior a la
    creación de las regiones de Arica y Parinacota, Los Ríos y Ñuble).

controles:
