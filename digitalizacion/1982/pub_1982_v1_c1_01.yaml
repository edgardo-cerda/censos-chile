# Transcripción del Cuadro 1.01 del censo de 1982 (Tomo I).
# El CSV del mismo nombre reproduce el cuadro tal como está impreso, sin la columna de índice de
# masculinidad (derivable). El cuadro se repite en tres secciones (etiqueta arriba a la derecha):
# TOTAL (PDF 40-61), URBANO (PDF 62-83) y RURAL (PDF 84-104). Las secciones URBANO y RURAL omiten
# las unidades sin población del área respectiva. "-" = guion impreso (mujeres de la comuna Antártica).
# Los nombres van como en el listado de computador: mayúsculas y sin tildes (sí con Ñ y Ü).

