# Transcripción de las columnas TOTAL (hombres, mujeres, total) del cuadro «Edad, estado civil y
# sexo de los habitantes en 1930, por provincias» (Cuadro 4 del Tomo de edades; págs. 8-29, PDF
# 315-336). Edades simples de 0 a 100 años y «más de 100»; se omiten las columnas por estado civil
# (módulo temático). Una fila por provincia y edad, y el total de cada provincia.

fuente_id: pub_1930
cuadro: "edad4"
titulo: Edad, estado civil y sexo de los habitantes en 1930, por provincias
paginas:
  - {pdf: 315, impresa: "8", desde: Tarapacá}
metodo: transcripcion_manual
verificacion: control_aritmetico
transcripcion:
  fecha: 2026-10-19
  por: Claude (asistido)
  recortes_dpi: 200-400
  nota: >
    Lectura visual de las columnas de total a 200 dpi; las celdas dudosas a 320-400 dpi. Las
    provincias de 1930 son 17 (Tarapacá a Magallanes, con Aysén); la página de cada fila no se
    registra por separado (PDF 315-336 en orden).

indicador: poblacion
unidad: personas
fijas: {censo: 1930, area: _T}

territorio:
  columna: territorio
  nivel: {_otro: provincia}
  dpa_version: provincias_1930

filas:
  edad_min: {columna: edad_min}
  edad_max: {columna: edad_max}

columnas:
  hombres: {sexo: hombre}
  mujeres: {sexo: mujer}
  total: {sexo: _T}

notas_cuadro:
  - >
    Los totales de las 17 provincias suman el total del país (2 122 709 hombres, 2 164 736
    mujeres, 4 287 445) y coinciden con 1952 C5. Sumados por decenios, coinciden con el
    comparativo 7 de 1952 una vez corregidas las erratas de Valdivia (diferencias residuales de 1 en
    20-29, 70-79 y 100 y más).
  - >
    Erratas sin celda identificable (excepciones del control): en Cautín los hombres suman 10 menos
    y las mujeres 10 más que sus totales (todas las filas cuadran y los totales coinciden con 1952
    C5); en Magallanes las mujeres y el total suman 1 menos que lo impreso.

notas_celdas:
  - {territorio: Valdivia, edad: "30", columna: total, estado_valor: inconsistente, nota: "Impreso 5 844; hombres + mujeres = 5 847, valor coherente con el comparativo 7 de 1952."}
  - {territorio: Valdivia, edad: "31", columna: total, estado_valor: inconsistente, nota: "Impreso 1 772; hombres + mujeres = 1 742, valor coherente con el comparativo 7 de 1952."}
  - {territorio: Valdivia, edad: "40", columna: hombres, estado_valor: inconsistente, nota: "Impreso 1 213 (y total 4 678); los valores coherentes con la suma de la columna, el total de la provincia y el comparativo 7 de 1952 son 2 223 hombres y 4 688 en total."}
  - {territorio: Valdivia, edad: "40", columna: total, estado_valor: inconsistente, nota: "Impreso 4 678; coherente 4 688 (ver hombres)."}

