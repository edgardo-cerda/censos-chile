transcripcion:
  fecha: 2026-10-15
  por: Claude (asistido)
  recortes_dpi: 160-400
  nota: >
    Lectura visual de media página a 160 dpi; dígitos dudosos a 400 dpi. Las filas de comuna
    impresas en negrita poco legible (Bío-Bío, Malleco) se contrastaron con la suma de sus distritos.

indicador: poblacion
unidad: personas

territorio:
  columna: territorio
  columna_nivel: nivel
  niveles: [provincia, departamento, comuna]
  totales_al_final: true
  dpa_version: provincias_1940

columnas:
