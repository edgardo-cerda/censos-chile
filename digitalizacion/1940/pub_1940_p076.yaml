# Transcripción del cuadro "Población urbana-rural por sexo según provincias, departamentos,
# comunas y distritos, con indicación del número de viviendas" del censo de 1940.
# El cuadro no tiene número: se identifica por su página impresa inicial (76).
# El CSV reproduce las filas de comuna, departamento y provincia tal como están impresas, sin los
# distritos ni las columnas de porcentaje. En este cuadro los totales van DESPUÉS de sus unidades
# (las comunas preceden a su departamento y los departamentos a su provincia). "-" = guion impreso.
# El cuadro no trae total del país.

