# Transcripción del cuadro general «Clasificación de los habitantes por Departamentos i Provincias,
# según el sexo i edad, desde un mes hasta cien años adelante» del censo de 1895 (tomo IV, págs.
# 467-486): sexo × 26 grupos de edad por departamento, provincia y país. Las columnas de total
# general y población urbana y rural del mismo cuadro están en pub_1895_cg_area.
# El cuadro va en cuatro bloques de provincias de cinco páginas cada uno (menores de 2 años; 2 a 35 o
# 2 a 25; ... ; 95 y más con totales). Los menores de un año vienen en meses (hasta 1 mes, 1 a 3,
# 3 a 6 y 6 meses a 1 año): se registran con edad 0 y la dimensión adicional "meses". «De 2 a 5»
# se registra como 2-4 años (el tramo siguiente empieza en 5). El impreso usa «....» para la celda
# sin casos; se transcribe como «-». Nombres de departamento como en el Cuadro 1 de 1920 (Serena,
# Andes, Ligua, Victoria y Union del impreso: La Serena, Los Andes, La Ligua, La Victoria, La Unión).

fuente_id: pub_1895
cuadro: "IV.467"
titulo: Clasificación de los habitantes por departamentos i provincias, según el sexo i edad, desde un mes hasta cien años adelante
paginas:
  - {pdf: 2455, impresa: "467", desde: Tarapacá}
  - {pdf: 2460, impresa: "472", desde: Valparaíso}
  - {pdf: 2465, impresa: "477", desde: Linares}
  - {pdf: 2470, impresa: "482", desde: Angol}
metodo: transcripcion_manual
verificacion: control_aritmetico
transcripcion:
  fecha: 2026-10-20
  por: Claude (asistido)
  recortes_dpi: 200-300
  nota: >
    En el PDF del INE estas páginas (2455-2474) son un escaneo bitonal de ~72 dpi que no se lee con
    seguridad; la lectura se hizo sobre la copia del tomo IV de Memoria Chilena (MC0055464, PDF
    463-482; ver metadatos/fuentes.yaml), y las páginas indicadas son las del PDF del INE. Cada
    celda se validó con la suma de las edades (fila) y la de los departamentos (columna): toda
    diferencia que no se compensa en ambas se releyó ampliada. Tarapacá y Antofagasta se cotejaron
    además con el resumen por departamentos de sus tomos provinciales (mismas cifras impresas).

indicador: poblacion
unidad: personas
fijas: {censo: 1895, area: _T}

territorio:
  columna: territorio
  columna_nivel: nivel
  niveles: [provincia, departamento]
  totales_al_final: true
  dpa_version: provincias_1895

filas:
  edad_min: {columna: edad_min}
  edad_max: {columna: edad_max}
  meses: {columna: meses}

columnas:
  hombres: {sexo: hombre}
  mujeres: {sexo: mujer}

notas_cuadro:
  - >
    El original trae muchas erratas aritméticas. Donde la fila y la columna fallan por la misma
    cantidad, la celda culpable se anota como inconsistente con el valor implicado. Las demás
    diferencias no tienen celda identificable y quedan como excepciones de los controles: filas cuyas
    edades no suman el total (Antofagasta, Tocopilla, Copiapó, Freirina, Vallenar, Chañaral, Atacama,
    Cachapoal, O'Higgins, Curicó, Curepto, Talca, Cauquenes, Itata, Maule, los cuatro departamentos de
    Ñuble, Nacimiento, Mulchén, Bío-Bío, La Unión, Valdivia, Llanquihue y el país) y columnas de
    Antofagasta, Maule y Ñuble que no suman el total provincial.
  - >
    En Colchagua las cifras de menores de 2 años (págs. 472, filas de San Fernando, Caupolicán y
    total) repiten por error las de 2 a 25 años de la página siguiente. Se transcriben como están y se
    anotan como inconsistentes; las cifras correctas están en el resumen del tomo provincial,
    transcrito aparte (pub_1895_colchagua_menores2).
  - >
    Totales por sexo de las provincias: coinciden con el comparativo 5 de 1952 salvo Valparaíso
    (hombres 109 972; 1952 C5: 109 971, aunque los departamentos suman 109 972) y Bío-Bío (mujeres
    44 085, anotada; 1952 C5: 44 086). El país, 1 332 769 hombres y 1 355 216 mujeres (1952 C5:
    1 355 215), sin Tacna. Por decenios de edad la fila del país coincide con el comparativo 7 de 1952
    (diferencias de 1 en los decenios de 10 a 99, por el ajuste de ese cuadro al total 2 687 984).

