  hombres: {sexo: hombre}
  mujeres: {sexo: mujer}

notas_cuadro:
  - >
    Las 30 cifras cuadran (departamentos = total provincial). Con ellas las edades de San Fernando y
    Caupolicán suman sus totales del cuadro general salvo 10 hombres de San Fernando (errata anotada
    en 70-75 años), y la provincia suma su total.

