# Transcripción del Cuadro N.° 1.3 del censo de 1960 (páginas giradas 90°: --rotar 90): población
# clasificada en urbana y rural, según sexo, por años simples de edad. Solo el país.
# Los menores de un año vienen por meses (0 a 11 meses), sin total de 0 años: se registran con
# edad 0 y la dimensión adicional "meses". La última fila es "100 años" y se registra como 100 y
# más (abierta), porque no hay otra fila mayor y las edades suman el total.

fuente_id: pub_1960
cuadro: "1.3"
titulo: Población clasificada en urbana y rural, según sexo, por años simples de edad
paginas:
  - {pdf: 156, impresa: "142", desde: República}
metodo: transcripcion_manual
verificacion: control_aritmetico
transcripcion:
  fecha: 2026-10-19
  por: Claude (asistido)
  recortes_dpi: 190
  nota: >
    Lectura visual a 190 dpi (PDF 156-160). Dos cifras con el último dígito borroso (hombres de 57
    y 59 años) se fijaron con total - mujeres.

indicador: poblacion
unidad: personas
fijas: {censo: 1960}

territorio:
  columna: territorio
  nivel: {_otro: pais}
  dpa_version: provincias_1960

filas:
  edad_min: {columna: edad_min}
  edad_max: {columna: edad_max}
  meses: {columna: meses}

columnas:
  total_total: {area: _T, sexo: _T}
  total_hombres: {area: _T, sexo: hombre}
  total_mujeres: {area: _T, sexo: mujer}
  urbana_total: {area: urbana, sexo: _T}
  urbana_hombres: {area: urbana, sexo: hombre}
  urbana_mujeres: {area: urbana, sexo: mujer}
  rural_total: {area: rural, sexo: _T}
  rural_hombres: {area: rural, sexo: hombre}
  rural_mujeres: {area: rural, sexo: mujer}

notas_cuadro:
  - >
    Las 1.017 cifras cuadran: hombres + mujeres = total y urbana + rural = total en cada fila, y la
    suma de meses y años simples es igual al total impreso (en negrita) de cada columna. Coincide
    con el Cuadro 1.2 (total, urbana y rural por sexo). Sin edad ignorada.

controles:
  - {tipo: suma_dimension, dimension: sexo, total: _T, partes: [hombre, mujer]}
  - {tipo: suma_dimension, dimension: area, total: _T, partes: [urbana, rural]}
