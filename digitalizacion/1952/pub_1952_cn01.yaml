# Transcripción del Cuadro Nacional N.° 1 del censo de 1952 (Tomo I): población total del país por
# edades y sexo, según áreas urbana y rural (edad simple). Las págs. 85-116 del Tomo I faltan en el PDF
# del INE (pub_1952); se transcribe desde la copia de Memoria Chilena (mc_1952_t1).

fuente_id: mc_1952_t1
cuadro: "N1"
titulo: Población total del país por edades y sexo, según áreas urbana y rural
paginas:
  - {pdf: 94, impresa: "103", desde: REPUBLICA}
metodo: transcripcion_manual
verificacion: control_aritmetico
transcripcion:
  fecha: 2026-10-21
  por: Claude (asistido)
  recortes_dpi: 300-600
  nota: >
    Las filas «83 años» a «Edad ignorada» están en la pág. 104 (PDF 95). Mujeres de 95 años: la cifra
    está borrosa; se lee 562, que es lo que dan las sumas por fila y columna y el Cuadro Nacional 7.

indicador: poblacion
unidad: personas
fijas: {censo: 1952}

territorio:
  columna: territorio
  nivel: {_otro: pais}
  dpa_version: provincias_1952

filas:
  edad_min: {columna: edad_min}
  edad_max: {columna: edad_max}
  edad_estado: {columna: edad_estado}

columnas:
  total_total: {area: _T, sexo: _T}
  total_hombres: {area: _T, sexo: hombre}
  total_mujeres: {area: _T, sexo: mujer}
  urbana_total: {area: urbana, sexo: _T}
  urbana_hombres: {area: urbana, sexo: hombre}
  urbana_mujeres: {area: urbana, sexo: mujer}
  rural_total: {area: rural, sexo: _T}
  rural_hombres: {area: rural, sexo: hombre}
  rural_mujeres: {area: rural, sexo: mujer}

notas_cuadro:
  - >
    Las 927 cifras cuadran (hombres + mujeres = total; urbana + rural = total; edades = total) salvo
    la errata anotada. Los quinquenios del total coinciden cifra por cifra con el Cuadro Nacional 7.

notas_celdas:
  - {territorio: REPUBLICA, edad: 12 años, columna: rural_hombres, estado_valor: inconsistente, nota: "Impreso 35 889 (lectura clara); total - mujeres = 35 839, como la suma de las edades y la de urbana + rural."}

