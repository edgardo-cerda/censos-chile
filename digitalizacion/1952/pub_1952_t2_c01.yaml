# Transcripción del Cuadro N.° 1 del Tomo II (Núcleo Central) del censo de 1952, «Población urbana y
# rural por años de edad y sexo», para cada una de las cinco provincias del Núcleo Central
# (Aconcagua, Valparaíso, Santiago, O'Higgins y Colchagua) y sus comunas. Es la única edad bajo el
# nivel del país en 1952: las demás provincias no tienen tomo con edad. Cada provincia ocupa dos
# páginas (edades 0 a 76 y, en la siguiente, 77 a 100 y más, sin dato y totales); después vienen sus
# comunas, en el orden del resumen por comunas. Transcritas por ahora las comunas de Aconcagua y
# Valparaíso. El CSV reproduce las filas como están impresas, con los totales al final; en las
# comunas no se imprimen las edades sin población (ninguna fila).

