metodo: transcripcion_manual
verificacion: control_aritmetico
transcripcion:
  fecha: 2026-10-21
  por: Claude (asistido)
  recortes_dpi: 220-500
  nota: >
    Lectura directa de la imagen (el OCR de prueba fallaba en casi la mitad de las filas). Cada fila
    se comprobó con sus seis sumas (hombres + mujeres y urbana + rural) y cada columna con su total.

indicador: poblacion
unidad: personas
fijas: {censo: 1952}

territorio:
  columna: territorio
  columna_nivel: nivel
  niveles: [provincia, comuna]
  dpa_version: provincias_1952

filas:
  edad_min: {columna: edad_min}
  edad_max: {columna: edad_max}
  edad_estado: {columna: edad_estado}

columnas:
  total_total: {area: _T, sexo: _T}
  total_hombres: {area: _T, sexo: hombre}
  total_mujeres: {area: _T, sexo: mujer}
  urbana_total: {area: urbana, sexo: _T}
  urbana_hombres: {area: urbana, sexo: hombre}
  urbana_mujeres: {area: urbana, sexo: mujer}
  rural_total: {area: rural, sexo: _T}
  rural_hombres: {area: rural, sexo: hombre}
  rural_mujeres: {area: rural, sexo: mujer}

notas_cuadro:
  - >
    «00 (*)» = sin dato (edad ignorada). Todas las filas cuadran por fila y por columna salvo las
    erratas anotadas. Los totales de cada provincia (área × sexo) son iguales a los del Cuadro
    Nacional 2, y los de cada comuna, a los del resumen por comunas de su provincia.
  - >
    La suma de las comunas es igual, edad por edad, a la provincia, salvo las erratas anotadas y en
    Valparaíso a los 80 y 85 años: las comunas dan 3 hombres urbanos más a los 80 años y 3 menos a
    los 85 que la fila de la provincia (todas las comunas cuadran por dentro; impreso así).

notas_celdas:
  - {territorio: Valparaíso, nivel: provincia, edad: "21", columna: urbana_total, estado_valor: inconsistente, nota: "Impreso 8 651 (lectura clara a 500 dpi); hombres + mujeres = 8 551, que es también lo que da la suma de la columna."}
  - {territorio: Santiago, nivel: provincia, edad: "6", columna: rural_hombres, estado_valor: inconsistente, nota: "Impreso 5 735 (lectura clara a 500 dpi); total - mujeres = 3 735, como la suma de la columna y la de urbana + rural."}
  - {territorio: "O'Higgins", nivel: provincia, edad: "53", columna: rural_mujeres, estado_valor: inconsistente, nota: "Impreso 169 (lectura clara a 500 dpi); total - hombres = 269, como la suma de la columna y la de urbana + rural."}
  - {territorio: Colchagua, nivel: provincia, edad: "22", columna: total_hombres, estado_valor: inconsistente, nota: "Impreso 1 428; urbana + rural = 1 422 y total - mujeres = 1 422, como la suma de la columna."}
  - {territorio: Los Andes, nivel: comuna, edad: "54", columna: urbana_total, estado_valor: inconsistente, nota: "Impreso 11 (lectura clara a 450 dpi); hombres + mujeres = 111, como la suma de la columna."}
  - {territorio: Nogales, nivel: comuna, edad: "23", columna: urbana_mujeres, estado_valor: inconsistente, nota: "Impreso 81 (lectura clara a 450 dpi); total urbano - hombres = 87, como la suma de la columna."}
  - {territorio: Nogales, nivel: comuna, edad: "40", columna: urbana_total, estado_valor: inconsistente, nota: "Impreso 16 (lectura clara a 450 dpi); hombres + mujeres = 116, como la suma de la columna."}
  - {territorio: Viña del Mar, nivel: comuna, edad: "33", columna: total_hombres, estado_valor: inconsistente, nota: "Impreso 639 (lectura clara a 450 dpi); urbana + rural = 539 y total - mujeres = 539, como la suma de la columna."}

