notas_cuadro:
  - >
    Las sumas cuadran salvo en Valparaíso. Los totales por sexo de cada departamento coinciden con
    el cuadro 7 (edades), las provincias con el comparativo 5 de 1952 y la población urbana y rural
    de departamentos y provincias con el Cuadro 3 de 1920, salvo Quillota.

