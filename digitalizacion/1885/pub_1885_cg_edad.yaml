  - {territorio: Imperial, nivel: departamento, edad: Total, columna: mujeres, estado_valor: inconsistente, nota: "Impreso 8 875; la suma de las edades y el total de la provincia implican 8 885."}
  - {territorio: Cañete, nivel: departamento, edad: Hasta 1 mes, columna: hombres, estado_valor: inconsistente, nota: "Impreso 13; la suma de las edades y el total de la provincia implican 33."}
  - {territorio: Arauco, nivel: departamento, edad: De 1 a 2 años, columna: mujeres, estado_valor: inconsistente, nota: "Impreso 849; la suma de las edades y el total de la provincia implican 549."}
  - {territorio: Concepción, nivel: departamento, edad: De 95 a 100, columna: mujeres, estado_valor: inconsistente, nota: "Impreso 1; la suma de las edades y el total de la provincia implican 11."}
  - {territorio: Chillán, nivel: departamento, edad: De 25 a 30, columna: hombres, estado_valor: inconsistente, nota: "Impreso 3 527; la suma de las edades y el total de la provincia implican 2 527."}
  - {territorio: Linares, nivel: departamento, edad: De 10 a 15, columna: mujeres, estado_valor: inconsistente, nota: "Impreso 2 643; la suma de las edades y el total de la provincia implican 2 463."}
  - {territorio: Talca, nivel: departamento, edad: De 30 a 35, columna: hombres, estado_valor: inconsistente, nota: "Impreso 1 930; la suma de las edades y el total de la provincia implican 1 936."}
  - {territorio: República, nivel: pais, edad: De 85 a 90, columna: hombres, estado_valor: inconsistente, nota: "Impreso 1 846; la suma de las edades y la de las provincias implican 1 850."}
  - {territorio: República, nivel: pais, edad: De 85 a 90, columna: mujeres, estado_valor: inconsistente, nota: "Impreso 2 266; la suma de las edades y la de las provincias implican 2 262."}

