# Transcripción de los Estados N.º 1 a 7 de la provincia del Maule (tomo I, 1845; copia de Memoria
# Chilena): «Cuadro de la demarcacion territorial de cada una de las 36 Subdelegaciones…» (N.º 1) y de
# los distritos de cada departamento (N.º 2 Cauquenes, 3 Constitución, 4 Linares, 5 Parral, 6 San
# Carlos y 7 Itata), «con espresion del número de sus habitantes». Solo se transcribe la población;
# se omiten los límites, la extensión en leguas cuadradas y los habitantes por legua.
# Los departamentos no traen total en estos cuadros (filas sin cifra); la población de cada
# subdelegación sale del Estado N.º 1 (PDF 58) y la de cada distrito, de los Estados N.º 2 a 7.

