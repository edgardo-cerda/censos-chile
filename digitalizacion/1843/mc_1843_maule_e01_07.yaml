notas_cuadro:
  - >
    Distritos con número y sin nombre («De la pob. hasta la legua»): 1.º a 5.º de Cauquenes, 1.º y
    2.º del Parral y 1.º a 4.º de Quirihue; también el 4.º de Pocillas. Itata tiene 39 distritos
    aunque el título del Estado N.º 7 dice 38 (154 en la provincia, como dice el texto, pág. 50).
    En el Estado N.º 7 la columna de población va corrida respecto de los nombres; las cifras se
    asignan en orden dentro de cada subdelegación, cuyas sumas cuadran.
  - >
    Los distritos de cada subdelegación suman la cifra del Estado N.º 1, salvo Chanco (errata). Las
    subdelegaciones suman, por departamento, las cifras de los sinópticos de 1865 y 1875 (Cauquenes
    46 634, Constitución 5 011, Linares 27 753, Parral 15 428, San Carlos 27 114, Itata 24 584;
    provincia 146 524), no las de los Cuadros N.º 8 y 9 (46 643, 27 760 y 24 586 en tres de ellos).
  - >
    Las cifras de Sausal (5 410) y Longaví (3 561) tienen el 5 parecido al 3 en el escaneo; se
    confirman con la suma de sus distritos (y Sausal, con la extensión por los habitantes por legua).

